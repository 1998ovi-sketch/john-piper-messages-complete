name: Build and publish RSS archive

on:
  workflow_dispatch:
  schedule:
    - cron: '23 4 * * *'

permissions:
  actions: read
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python build_feed.py
        env:
          FEED_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/john-piper-messages-complete.rss
      - name: Commit refreshed catalog and feed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add catalog.json unresolved_messages.json public/
          git diff --cached --quiet || git commit -m 'Refresh John Piper Messages RSS archive'
          git push
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
